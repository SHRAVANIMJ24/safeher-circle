spring.application.name=backend

# ---- Database ----
spring.datasource.url=jdbc:postgresql://localhost:5432/safeher
spring.datasource.username=postgres
# Real password lives in application-local.properties, which git ignores.
spring.datasource.password=

# The schema is managed by docs/schema.sql, not by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Auth ----
# Override this in application-local.properties. Must be 32+ characters.
safeher.jwt.secret=
safeher.jwt.ttl-seconds=86400

# ---- CORS ----
safeher.cors.allowed-origins=http://localhost:5173

# ---- Local profile is loaded on top of this file ----
spring.profiles.active=local

server.port=8081
