<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="960" height="720" fill="#f7f6f3"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#565c68"/></marker>
<marker id="arrowfaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b919c"/></marker>
</defs>
<text x="50" y="48" font-size="21" font-weight="600" font-family="Georgia, 'Times New Roman', serif" fill="#16181d">Donation exchange — states and transitions</text>
<text x="50" y="69" font-size="13" fill="#8b919c">What happens to a listing, and what happens to each response to it.</text>
<text x="50" y="112" text-anchor="start" font-size="11" fill="#8b919c" font-weight="600">THE RESPONSE</text>
<line x1="50" y1="122" x2="910" y2="122" stroke="#e3e1dc" stroke-width="1"/>
<rect x="157.8" y="155" width="84.4" height="34" rx="17" fill="#f3e8ee" stroke="#6e2b4f" stroke-width="1.5"/>
<text x="200" y="177" text-anchor="middle" font-size="12.5" fill="#6e2b4f" font-weight="600" font-family="'Courier New', monospace">PENDING</text>
<rect x="344.2" y="155" width="91.6" height="34" rx="17" fill="#e7f0ed" stroke="#2e6259" stroke-width="1.5"/>
<text x="390" y="177" text-anchor="middle" font-size="12.5" fill="#2e6259" font-weight="600" font-family="'Courier New', monospace">ACCEPTED</text>
<rect x="529.0" y="155" width="142.0" height="34" rx="17" fill="#ffffff" stroke="#2e6259" stroke-width="1.5"/>
<text x="600" y="177" text-anchor="middle" font-size="12.5" fill="#2e6259" font-weight="600" font-family="'Courier New', monospace">handover agreed</text>
<rect x="770.6" y="155" width="98.8" height="34" rx="17" fill="#16181d" stroke="#16181d" stroke-width="1.5"/>
<text x="820" y="177" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="600" font-family="'Courier New', monospace">COMPLETED</text>
<line x1="242" y1="172" x2="342" y2="172" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="292.0" y="158" text-anchor="middle" font-size="11" fill="#565c68" font-weight="400">owner accepts</text>
<text x="292.0" y="198" text-anchor="middle" font-size="10" fill="#8b919c" font-weight="400">listing → MATCHED</text>
<line x1="438" y1="172" x2="534" y2="172" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="486.0" y="158" text-anchor="middle" font-size="11" fill="#565c68" font-weight="400">one suggests,</text>
<text x="486.0" y="198" text-anchor="middle" font-size="10" fill="#8b919c" font-weight="400">the other confirms</text>
<line x1="666" y1="172" x2="768" y2="172" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="717.0" y="158" text-anchor="middle" font-size="11" fill="#565c68" font-weight="400">either marks it done</text>
<text x="717.0" y="198" text-anchor="middle" font-size="10" fill="#8b919c" font-weight="400">listing → FULFILLED</text>
<text x="105" y="158" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">a response arrives</text>
<line x1="60" y1="172" x2="156" y2="172" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M200 189 L200 264 L296 264" fill="none" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="314.2" y="247" width="91.6" height="34" rx="17" fill="#ffffff" stroke="#cfccc5" stroke-width="1.5"/>
<text x="360" y="269" text-anchor="middle" font-size="12.5" fill="#565c68" font-weight="600" font-family="'Courier New', monospace">DECLINED</text>
<text x="248" y="256" text-anchor="middle" font-size="11" fill="#565c68" font-weight="400">owner declines</text>
<text x="438" y="260" text-anchor="start" font-size="11" fill="#8b919c" font-weight="400">she may respond again later —</text>
<text x="438" y="276" text-anchor="start" font-size="11" fill="#8b919c" font-weight="400">a decline is not permanent</text>
<path d="M390 189 L390 336 L316 336" fill="none" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M200 189 L200 336 L251 336" fill="none" stroke="#565c68" stroke-width="1.4"/>
<rect x="199.0" y="319" width="118" height="34" rx="17" fill="#ffffff" stroke="#cfccc5" stroke-width="1.5"/>
<text x="258" y="341" text-anchor="middle" font-size="12.5" fill="#565c68" font-weight="600" font-family="'Courier New', monospace">WITHDRAWN</text>
<text x="438" y="330" text-anchor="start" font-size="11" fill="#8b919c" font-weight="400">she backs out — possible right up until it is marked</text>
<text x="438" y="346" text-anchor="start" font-size="11" fill="#8b919c" font-weight="400">done, including after agreeing a place</text>
<text x="50" y="400" text-anchor="start" font-size="11" fill="#8b919c" font-weight="600">THE LISTING</text>
<line x1="50" y1="410" x2="910" y2="410" stroke="#e3e1dc" stroke-width="1"/>
<rect x="118.6" y="443" width="62.8" height="34" rx="17" fill="#ffffff" stroke="#cfccc5" stroke-width="1.5"/>
<text x="150" y="465" text-anchor="middle" font-size="12.5" fill="#16181d" font-weight="600" font-family="'Courier New', monospace">OPEN</text>
<rect x="357.8" y="443" width="84.4" height="34" rx="17" fill="#ffffff" stroke="#cfccc5" stroke-width="1.5"/>
<text x="400" y="465" text-anchor="middle" font-size="12.5" fill="#16181d" font-weight="600" font-family="'Courier New', monospace">MATCHED</text>
<rect x="630.6" y="443" width="98.8" height="34" rx="17" fill="#ffffff" stroke="#cfccc5" stroke-width="1.5"/>
<text x="680" y="465" text-anchor="middle" font-size="12.5" fill="#16181d" font-weight="600" font-family="'Courier New', monospace">FULFILLED</text>
<line x1="186" y1="460" x2="356" y2="460" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="271.0" y="446" text-anchor="middle" font-size="11" fill="#565c68" font-weight="400">a response is accepted</text>
<text x="271.0" y="486" text-anchor="middle" font-size="10" fill="#8b919c" font-weight="400">and it cannot be split</text>
<line x1="444" y1="460" x2="630" y2="460" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="537.0" y="446" text-anchor="middle" font-size="11" fill="#565c68" font-weight="400">the handover is marked done</text>
<path d="M400 477 L400 516 L172 516 L172 477" fill="none" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="286" y="532" text-anchor="middle" font-size="11" fill="#565c68" font-weight="400">the accepted response is withdrawn</text>
<text x="790" y="465" text-anchor="start" font-size="11.5" fill="#8b919c" font-weight="400">· terminal</text>
<rect x="50" y="566" width="860" height="112" rx="8" fill="#e7f0ed" stroke="#2e6259" stroke-width="1.4"/>
<text x="74" y="594" text-anchor="start" font-size="13.5" fill="#2e6259" font-weight="600">When the donor ticks “I can split this between people”</text>
<text x="74" y="618" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">The listing never leaves OPEN. Accepting someone does not hide it, completing a handover does not close it, and a withdrawal has</text>
<text x="74" y="634" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">nothing to restore. She closes it herself when she runs out.</text>
<text x="74" y="650" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">Quantity is free text — “5 packs” — so the platform cannot work out that it covers two people asking for two and three. Rather than</text>
<text x="74" y="666" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">pretend to do that arithmetic, it asks her.</text>
</svg>