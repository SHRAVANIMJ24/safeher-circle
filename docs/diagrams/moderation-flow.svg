<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="960" height="720" fill="#f7f6f3"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#565c68"/></marker>
<marker id="arrowfaint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b919c"/></marker>
</defs>
<text x="50" y="48" font-size="21" font-weight="600" font-family="Georgia, 'Times New Roman', serif" fill="#16181d">Moderation pipeline</text>
<text x="50" y="69" font-size="13" fill="#8b919c">Two things can raise content in the queue. Neither of them can hide it.</text>
<text x="50" y="112" text-anchor="start" font-size="11" fill="#8b919c" font-weight="600">WHAT CAN RAISE SOMETHING</text>
<line x1="50" y1="122" x2="910" y2="122" stroke="#e3e1dc" stroke-width="1"/>
<rect x="50" y="146" width="250" height="106" rx="8" fill="#ffffff" stroke="#cfccc5" stroke-width="1.4"/>
<rect x="50" y="146" width="250" height="3" rx="1.5" fill="#565c68"/>
<text x="175.0" y="174" text-anchor="middle" font-size="13.5" fill="#16181d" font-weight="600">Three separate reports</text>
<text x="175.0" y="196" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">on the same post, comment</text>
<text x="175.0" y="212" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">or listing, from three</text>
<text x="175.0" y="228" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">different accounts</text>
<rect x="340" y="146" width="250" height="106" rx="8" fill="#ffffff" stroke="#6e2b4f" stroke-width="1.4"/>
<rect x="340" y="146" width="250" height="3" rx="1.5" fill="#6e2b4f"/>
<text x="465.0" y="174" text-anchor="middle" font-size="13.5" fill="#16181d" font-weight="600">A toxicity score above 0.85</text>
<text x="465.0" y="196" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">on a comment only —</text>
<text x="465.0" y="212" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">posts are not scored,</text>
<text x="465.0" y="228" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">for the reason below</text>
<line x1="175" y1="252" x2="175" y2="296" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="465" y1="252" x2="465" y2="296" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="50" y="296" width="540" height="86" rx="8" fill="#ffffff" stroke="#2e6259" stroke-width="1.6"/>
<text x="320" y="326" text-anchor="middle" font-size="15" fill="#2e6259" font-weight="600">Marked FLAGGED</text>
<text x="320" y="348" text-anchor="middle" font-size="11.5" fill="#565c68" font-weight="400">Raised in the moderation queue. Still visible to everyone,</text>
<text x="320" y="365" text-anchor="middle" font-size="11.5" fill="#565c68" font-weight="400">exactly as before. Nothing a reader sees has changed.</text>
<line x1="590" y1="339" x2="646" y2="339" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="646" y="296" width="264" height="86" rx="8" fill="#ffffff" stroke="#cfccc5" stroke-width="1.4"/>
<rect x="646" y="296" width="264" height="3" rx="1.5" fill="#16181d"/>
<text x="778.0" y="324" text-anchor="middle" font-size="13.5" fill="#16181d" font-weight="600">A moderator reads it</text>
<text x="778.0" y="346" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">and sees the score as a number,</text>
<text x="778.0" y="362" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">not as a verdict</text>
<path d="M778 382 L778 412 L400 412 L400 442" fill="none" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M778 382 L778 412 L760 412 L760 442" fill="none" stroke="#565c68" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="280" y="442" width="240" height="96" rx="8" fill="#ffffff" stroke="#cfccc5" stroke-width="1.4"/>
<rect x="280" y="442" width="240" height="3" rx="1.5" fill="#2e6259"/>
<text x="400.0" y="470" text-anchor="middle" font-size="13.5" fill="#16181d" font-weight="600">Leave it up</text>
<text x="400.0" y="492" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">Status returns to published.</text>
<text x="400.0" y="508" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">The report is dismissed.</text>
<rect x="640" y="442" width="240" height="96" rx="8" fill="#ffffff" stroke="#cfccc5" stroke-width="1.4"/>
<rect x="640" y="442" width="240" height="3" rx="1.5" fill="#b4441e"/>
<text x="760.0" y="470" text-anchor="middle" font-size="13.5" fill="#16181d" font-weight="600">Take it down</text>
<text x="760.0" y="492" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">Status becomes REMOVED.</text>
<text x="760.0" y="508" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">The row is kept, so a wrong</text>
<text x="760.0" y="524" text-anchor="middle" font-size="11" fill="#8b919c" font-weight="400">call can be undone.</text>
<text x="50" y="470" text-anchor="start" font-size="13.5" fill="#16181d" font-weight="600">Only a person</text>
<text x="50" y="490" text-anchor="start" font-size="13.5" fill="#16181d" font-weight="600">reaches this point.</text>
<text x="50" y="514" text-anchor="start" font-size="11" fill="#8b919c" font-weight="400">There is no branch</text>
<text x="50" y="530" text-anchor="start" font-size="11" fill="#8b919c" font-weight="400">anywhere that removes</text>
<text x="50" y="546" text-anchor="start" font-size="11" fill="#8b919c" font-weight="400">content on a score.</text>
<rect x="50" y="574" width="860" height="122" rx="8" fill="#f3e8ee" stroke="#6e2b4f" stroke-width="1.4"/>
<text x="74" y="602" text-anchor="start" font-size="13.5" fill="#6e2b4f" font-weight="600">Why the model scores comments and not posts</text>
<text x="74" y="626" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">First-person account of workplace harassment</text>
<text x="474" y="626" text-anchor="start" font-size="11" fill="#6e2b4f" font-weight="600" font-family="'Courier New', monospace">0.0007</text>
<text x="74" y="642" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">First-person account of a sexual assault</text>
<text x="474" y="642" text-anchor="start" font-size="11" fill="#6e2b4f" font-weight="600" font-family="'Courier New', monospace">0.0021</text>
<text x="74" y="658" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">Notice about a free sanitary pad distribution</text>
<text x="474" y="658" text-anchor="start" font-size="11" fill="#6e2b4f" font-weight="600" font-family="'Courier New', monospace">0.0006</text>
<text x="74" y="674" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">A reply reading “you are a stupid liar… shut up”</text>
<text x="474" y="674" text-anchor="start" font-size="11" fill="#6e2b4f" font-weight="600" font-family="'Courier New', monospace">0.9851</text>
<text x="560" y="626" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">It detects abusive language aimed at a person,</text>
<text x="560" y="642" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">not whether a situation is distressing. Posts here</text>
<text x="560" y="658" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">are women describing what happened to them, in</text>
<text x="560" y="674" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">prose it cannot read. Comments are where people</text>
<text x="560" y="690" text-anchor="start" font-size="11" fill="#565c68" font-weight="400">attack each other.</text>
</svg>